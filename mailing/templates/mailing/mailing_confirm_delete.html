{% extends "mailing/base.html" %}


{% block content %}

<h1>Удалить рассылку "{{ mailing.name }}"?</h1>
<p>Вы уверены, что хотите удалить эту рассылку?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
  <a href="{% url 'dashboard' %}">Отмена</a>
</form>

{% endblock %}
