{% extends "mailing/base.html" %}

{% block content %}
<h2>Шаблоны сообщений</h2>
<a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">Создать сообщение</a>


<table class="table table-striped">
  <thead>
    <tr>
      <th>Тема</th>
      <th>Тело сообщения</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for message in object_list %}
    <tr>
      <td>{{ message.subject }}</td>
      <td>{{ message.body|truncatewords:20 }}</td>
      <td>
        <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-outline-primary">Изменить</a>
        <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
