{% extends "mailing/base.html" %}


{% block content %}
<h2>Получатели рассылок</h2>
<a href="{% url 'mailing:recipient_create' %}" class="btn btn-primary mb-3">Добавить получателя</a>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Email</th>
      <th>ФИО</th>
      <th>Комментарий</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for recipient in recipients %}
    <tr>
      <td>{{ recipient.email }}</td>
      <td>{{ recipient.full_name }}</td>
      <td>{{ recipient.comment|default:'' }}</td>
      <td>
        <a href="{% url 'mailing:recipient_update' recipient.pk %}" class="btn btn-sm btn-outline-primary">Изменить</a>
        <a href="{% url 'mailing:recipient_delete' recipient.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
